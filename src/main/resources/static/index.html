<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanchonete — Gestão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">Lanchonete</p>
        <p class="brand-tag">painel de cadastro</p>
      </div>
    </div>
    <p class="status" id="statusMsg" role="status"></p>
  </header>

  <main class="layout">
    <section class="panel form-panel" aria-labelledby="form-title">
      <div class="panel-head">
        <h1 id="form-title">Nova lanchonete</h1>
        <p id="form-subtitle">Preencha os dados e salve no cadastro.</p>
      </div>

      <form id="lanchoneteForm" novalidate>
        <input type="hidden" id="id" name="id">

        <label class="field">
          <span>Nome</span>
          <input type="text" id="nome" name="nome" placeholder="Ex.: Burger da Esquina" required maxlength="120" autocomplete="organization">
        </label>

        <label class="field">
          <span>Endereço</span>
          <input type="text" id="endereco" name="endereco" placeholder="Rua, número e bairro" required maxlength="200" autocomplete="street-address">
        </label>

        <label class="field">
          <span>Cidade</span>
          <input type="text" id="cidade" name="cidade" placeholder="Ex.: São Paulo" required maxlength="100" autocomplete="address-level2">
        </label>

        <div class="actions">
          <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar</button>
          <button type="button" class="btn btn-ghost" id="btnCancelar" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="panel list-panel" aria-labelledby="list-title">
      <div class="panel-head row">
        <div>
          <h2 id="list-title">Cadastro</h2>
          <p><span id="totalCount">0</span> registro(s)</p>
        </div>
        <button type="button" class="btn btn-ghost" id="btnAtualizar">Atualizar</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Endereço</th>
              <th>Cidade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaBody">
            <tr class="empty-row">
              <td colspan="5">Nenhuma lanchonete cadastrada ainda.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
